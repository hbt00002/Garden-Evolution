name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  phaser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phaser-prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: phaser-prototype/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
