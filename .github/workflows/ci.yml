name: CI

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phaser-prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The worker tests use node:sqlite, which needs Node 22.5 or newer.
          node-version: 22
          cache: npm
          cache-dependency-path: phaser-prototype/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
