name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  phaser:
    name: Unit tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phaser-prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: phaser-prototype/package-lock.json
      - run: npm ci
      # Mistakes a test might not reach: a name that is not defined, one that is
      # never used, a variable that hides another.
      - run: npm run lint
      - run: npm test
      - run: npm run build

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: phaser-prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: phaser-prototype/package-lock.json
      - run: npm ci
      - name: Install the browser
        run: npx playwright install --with-deps chromium
      # Builds the game, starts the real Worker on a throwaway local database
      # and drives it with a browser (see e2e/serve.mjs).
      - run: npm run e2e
      - name: Keep the report when a test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-report
          path: |
            phaser-prototype/playwright-report/
            phaser-prototype/test-results/
          retention-days: 7
