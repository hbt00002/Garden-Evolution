<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 30c-1 0-1.6-.7-1.6-1.6V18.4' fill='none' stroke='%238b5e3c' stroke-width='2.4' stroke-linecap='round'/%3E%3Cpath d='M16 18c0-4 3-7 7-8-1 4-3 7-7 8zm0 0c0-3-2.2-5.4-5.4-6 .6 3 2.4 5 5.4 6z' fill='%237ab648'/%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eaf3df" />
    <meta name="description" content="Garden Evolution — a relaxing 2048-inspired garden game in an evolving Japanese countryside." />
    <title>Garden Evolution</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <meta property="og:image" content="https://bolt.new/static/og_default.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png">
</head>
  <body>
    <!-- Evolving Japanese countryside environment (behind everything) -->
    <div class="env" id="env" aria-hidden="true">
      <svg class="env-sky" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice"></svg>
      <div class="env-haze"></div>
      <div class="env-particles" id="envParticles"></div>
    </div>

    <main class="game">
      <header class="topbar">
        <div class="brand">
          <h1 class="title">Garden Evolution</h1>
          <p class="hint">Swipe or use arrow keys to grow your garden.</p>
        </div>
        <div class="scores">
          <div class="score-box">
            <span class="score-label">Score</span>
            <span class="score-value" id="score">0</span>
          </div>
          <div class="score-box">
            <span class="score-label">Best</span>
            <span class="score-value" id="best">0</span>
          </div>
        </div>
      </header>

      <div class="controls">
        <button class="btn settings-btn" id="settingsBtn" type="button" aria-label="Settings" aria-haspopup="true">
          <svg viewBox="0 0 24 24" class="ico" aria-hidden="true">
            <path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm9.4 5.6-1.3-1a1 1 0 0 1 0-1.2l1.3-1a1 1 0 0 0 .3-1.2l-1-2.3a1 1 0 0 0-1.2-.5l-1.6.5a1 1 0 0 1-1-.3l-.8-1.4a1 1 0 0 0-.9-.5h-2.5a1 1 0 0 0-.9.5l-.8 1.4a1 1 0 0 1-1 .3l-1.6-.5a1 1 0 0 0-1.2.5l-1 2.3a1 1 0 0 0 .3 1.2l1.3 1a1 1 0 0 1 0 1.2l-1.3 1a1 1 0 0 0-.3 1.2l1 2.3a1 1 0 0 0 1.2.5l1.6-.5a1 1 0 0 1 1 .3l.8 1.4a1 1 0 0 0 .9.5h2.5a1 1 0 0 0 .9-.5l.8-1.4a1 1 0 0 1 1-.3l1.6.5a1 1 0 0 0 1.2-.5l1-2.3a1 1 0 0 0-.3-1.2z" fill="currentColor"/>
          </svg>
        </button>
        <button class="btn new-btn" id="newBtn" type="button">New Game</button>
        <!-- Settings panel (floating popover) -->
        <div class="settings-panel" id="settingsPanel" hidden>
          <h2 class="settings-title">Settings</h2>
          <label class="setting-row">
            <span class="setting-label">Music</span>
            <button class="toggle" id="musicToggle" type="button" role="switch" aria-checked="true">
              <span class="toggle-knob"></span>
            </button>
          </label>
          <label class="setting-row">
            <span class="setting-label">Sound Effects</span>
            <button class="toggle" id="sfxToggle" type="button" role="switch" aria-checked="true">
              <span class="toggle-knob"></span>
            </button>
          </label>
        </div>
      </div>

      <div class="board-wrap">
        <div class="board" id="board" aria-label="Garden board">
          <div class="grid" id="grid" aria-hidden="true"></div>
          <div class="tiles" id="tiles"></div>
          <div class="overlay" id="overlay" hidden>
            <div class="overlay-card">
              <h2 class="overlay-title">Garden Complete</h2>
              <div class="overlay-scores">
                <div><span>Final</span><strong id="finalScore">0</strong></div>
                <div><span>Best</span><strong id="finalBest">0</strong></div>
              </div>
              <button class="btn new-btn overlay-btn" id="playAgainBtn" type="button">Play Again</button>
            </div>
          </div>
        </div>
      </div>

      <div class="toast" id="toast" hidden></div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
